# Dashboards origin (Phase 4, SERVE-04). Agent-authored dashboard HTML renders ONLY
# here, never on the gateway (8080) or UI (8090) origins, which keep the ops key in
# localStorage. The origin boundary is what protects that key.
#
# Only /d/ reaches the gateway, and the gateway 404s any /d/ request that lacks the
# X-IC-Dashboards-Proxy header this file sets (overwriting any client-sent value).
#
# This file is included inside http{} by the stock nginx.conf, so map and
# log_format are legal here.
#
# Since Phase 9 this file is an envsubst template rendered by the official nginx
# entrypoint: only ${IC_LISTEN} and ${IC_GATEWAY} are substituted (filter ^IC_), and
# every other $name is an nginx variable.

# View/preview tokens ride in the query string (?t= / ?p=). Only the leading run of
# [A-Za-z0-9_./-] characters of the raw URI is ever logged: a literal "?", any
# percent-escape (%3F, %3f, %253F) or other punctuation ends the logged path and the
# rest becomes ?REDACTED (WR-01). The default is reached only when the whole URI is
# allowlisted characters, so it can never carry a query string.
map $request_uri $ic_log_uri {
    "~^(?<ic_path>[A-Za-z0-9_./-]*)[^A-Za-z0-9_./-]"  "${ic_path}?REDACTED";
    default                                            $request_uri;
}

# location /d/ matches on the normalized URI, but the variable gateway forward uses the
# raw URI, so "//d/", dot segments and percent-escapes would reach the gateway
# un-normalized; only canonical raw URIs are forwarded.
map $request_uri $ic_d_canonical {
    "~^/d(/[A-Za-z0-9_-]+)*/?(\?|$)"  1;
    default                           0;
}

# Phase 9 (DEPLOY-02): per-client rate limits. ic_d covers every proxied /d/ request;
# ic_d_data additionally covers the data routes. nginx does not count requests whose
# key is empty, so non-data routes never touch the ic_d_data zone.
map $uri $ic_d_data_key {
    "~^/d/[A-Za-z0-9_-]+/(v/[0-9]+/)?data/"  $binary_remote_addr;
    default                                   "";
}
limit_req_zone $binary_remote_addr zone=ic_d:10m rate=20r/s;
limit_req_zone $ic_d_data_key zone=ic_d_data:10m rate=10r/s;

log_format ic_dash '$remote_addr [$time_local] "$request_method $ic_log_uri $server_protocol" '
                   '$status $body_bytes_sent $request_time';

server {
    listen ${IC_LISTEN};
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log ic_dash;
    # At 'error' level nginx writes the raw request line (token included) on upstream
    # failures. 'crit' keeps tokens out; 502s still show in the masked access log.
    error_log /var/log/nginx/error.log crit;

    # Same re-resolve pattern as frontend/nginx.conf: survives app container recreation.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=${IC_RESOLVER_IPV6};
    resolver_timeout 5s;
    # An IP-literal gateway (the VM value) needs no resolver.
    set $gateway ${IC_GATEWAY};

    # Phase 9 (DEPLOY-02)
    # Only Caddy on the VM loopback is trusted to supply the client address; Caddy
    # overwrites any client-sent X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    # /d/ bodies never echo a token, so BREACH does not apply.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    # text/html is always compressed by nginx and must not be listed.
    gzip_types application/json application/javascript text/javascript text/css text/plain;

    limit_req_status 429;
    error_page 429 @ic_429;
    # 429 is not in add_header's default status list, hence "always".
    location @ic_429 {
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        return 429 "Too many requests\n";
    }

    # Vendored, byte-pinned chart libraries. vendor.json is never copied into the image.
    location ^~ /d/_lib/ {
        alias /usr/share/nginx/d_lib/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Phase 12 (AGENT-07): the opaque-origin frame loads the lib in CORS mode (SRI needs it); no credentials exist on this origin
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Only /d/ reaches the gateway.
    location /d/ {
        default_type text/plain;
        # return and add_header are safe inside if in a location; body and headers equal
        # the gateway's not_found(), so the 404 stays uniform.
        if ($ic_d_canonical = 0) {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cache-Control "no-store" always;
            return 404 "Not found\n";
        }
        limit_except GET { deny all; }
        # Phase 9: rate limits run before proxy_pass.
        limit_req zone=ic_d burst=60 nodelay;
        limit_req zone=ic_d_data burst=50 nodelay;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-IC-Dashboards-Proxy "1";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
