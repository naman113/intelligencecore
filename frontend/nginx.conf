# Serves the built UI and proxies the API to the gateway on the compose network.
#
# The proxy is the point: it puts /api on the same origin as the page, so the
# ops key travels as a plain header with no CORS preflight — and the backend,
# which has no CORS middleware at all, needs no change to support this UI.

# No `upstream` block on purpose: nginx resolves an upstream{} hostname ONCE
# at startup and pins the IP, so recreating the app container (every gateway
# rebuild) left this proxy 502ing at a dead address until someone restarted
# the ui container. A variable proxy_pass + Docker's embedded DNS re-resolves
# per `valid` window instead, surviving app recreation with no restart.

server {
    listen 80;
    server_name _;

    # Quick 043: both values come from env (envsubst template). Defaults render to the
    # Docker values: resolver 127.0.0.11 (from the container's own resolv.conf via the
    # image's 15-local-resolvers.envsh) and http://app:8080.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=${IC_RESOLVER_IPV6};
    set $gateway ${IC_GATEWAY};

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads go through here. nginx defaults to 1 MB, which would
    # reject exactly the scanned invoices this product exists to read.
    client_max_body_size 32m;

    # Phase 12 (WR-12): CSP for the ops-key origin. nginx does not inherit server-level add_header into a location that has its own, so the same three lines are repeated in every such location.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The live log stream. Buffering on would hold every line until the
    # response ended — which, for a stream that never ends, means forever.
    location /api/logs/stream {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    # Older bundled mime.types have no entry for .webmanifest, and a manifest
    # served as octet-stream is one the browser ignores — "Add to Home Screen"
    # would quietly degrade to a bookmark. default_type only applies when the
    # extension map misses, so this is correct either way.
    # The regex also covers the Intelligence Corner manifest; a regex location wins over the `location /` prefix.
    location ~ ^/manifest(-intelligence)?\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes: anything that isn't a real file is the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
