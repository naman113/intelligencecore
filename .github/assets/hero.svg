<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Intelligence Corner: how the business is doing, what it noticed, and what it wants approved">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#2B7FD4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2B7FD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8B44C"/>
      <stop offset="1" stop-color="#D4952B"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5BA0E0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B7FD4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2B7FD4"/>
      <stop offset="1" stop-color="#5BA0E0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>

  <!-- corner brackets: the "corner" the product sits in -->
  <g fill="none" stroke="#2B7FD4" stroke-width="3" stroke-linecap="round">
    <path d="M56 104V56H104"/>
    <path d="M1240 332V380H1214"/>
  </g>

  <!-- mark: signal bar + owed dot (the app icon) -->
  <g transform="translate(96 132)">
    <rect width="76" height="76" rx="18" fill="#080C14" stroke="#164A82" stroke-width="2"/>
    <rect x="34" y="16" width="5" height="44" rx="2" fill="#2B7FD4"/>
    <circle cx="52" cy="30" r="7" fill="url(#gold)"/>
  </g>

  <g font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#F0F4F8">
    <text x="96" y="268" font-size="64" font-weight="700" letter-spacing="6">INTELLIGENCE</text>
    <text x="96" y="332" font-size="64" font-weight="700" letter-spacing="6" fill="#5BA0E0">CORNER</text>
  </g>
  <text x="96" y="376" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#A0AEC0">How the business is doing, what it noticed, and what it wants approved.</text>

  <!-- right side: a live KPI card -->
  <g transform="translate(800 92)" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect width="400" height="236" rx="16" fill="#0E1420" stroke="#164A82" stroke-opacity="0.7"/>
    <text x="24" y="38" font-size="14" fill="#718096" letter-spacing="2">REVENUE · LAST 30 DAYS</text>
    <text x="24" y="84" font-size="40" font-weight="700" fill="#F0F4F8">$ 482,190</text>
    <text x="376" y="84" font-size="16" fill="#5BA0E0" text-anchor="end">▲ 12.4%</text>
    <polyline fill="none" stroke="url(#spark)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
      points="24,170 56,160 88,166 120,148 152,152 184,134 216,140 248,118 280,124 312,104 344,110 376,92"/>
    <circle cx="376" cy="92" r="5" fill="#5BA0E0"/>
    <g transform="translate(24 192)">
      <rect width="352" height="30" rx="8" fill="#D4952B" fill-opacity="0.13"/>
      <circle cx="16" cy="15" r="5" fill="#D4952B"/>
      <text x="30" y="20" font-size="14" fill="#E8B44C">Overdue invoices up 3× this week · watch proposed</text>
    </g>
  </g>

  <!-- three verbs -->
  <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" letter-spacing="1.5">
    <g transform="translate(800 348)">
      <rect width="112" height="30" rx="15" fill="#2B7FD4" fill-opacity="0.14"/>
      <text x="56" y="20" text-anchor="middle" fill="#5BA0E0">OBSERVES</text>
    </g>
    <g transform="translate(944 348)">
      <rect width="112" height="30" rx="15" fill="#2B7FD4" fill-opacity="0.14"/>
      <text x="56" y="20" text-anchor="middle" fill="#5BA0E0">EXPLAINS</text>
    </g>
    <g transform="translate(1088 348)">
      <rect width="112" height="30" rx="15" fill="#D4952B" fill-opacity="0.14"/>
      <text x="56" y="20" text-anchor="middle" fill="#E8B44C">ASKS FIRST</text>
    </g>
  </g>
</svg>
