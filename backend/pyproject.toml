[project]
name = "agentic-system"
version = "0.1.0"
description = "Agentic system over the owner's business data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "langfuse>=2.50",
    "psutil>=6.0",
    "graphiti-core[anthropic,falkordb]>=0.3",
    # LayerLens drawing tools (CAD-PDF layer deconstruction/reconstruction)
    "pikepdf>=9.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",     # drawing revision-diff ink masks
    # Document intelligence: multipart upload intake
    "python-multipart>=0.0.9",
    # Document conversion: office/text attachments → plain text for eager extraction
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "xlrd>=2.0.1",
    # Document generation: house-styled pdf/docx/xlsx from model-written content
    "reportlab>=4.2",
    "mistune>=3.0",
    # Agent Skills: SKILL.md frontmatter (skillservice.parse_skill_md, safe_load only)
    "pyyaml>=6.0",
    # Phase 11: secret settings encrypted at rest (AES-GCM, GOLIVE-02)
    "cryptography>=50.0.2",
    "html5lib>=1.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
